<header class="app-header">
  <div class="header-container">
    <div class="header-brand">
      <a routerLink="/dashboard" class="brand-link">
        <div class="brand-icon">
          <i class="pi pi-building-columns" aria-hidden="true"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">{{ 'app.title' | translate }}</span>
          <span class="brand-tag">{{ 'app.subtitle' | translate }}</span>
        </div>
      </a>
    </div>

    <div class="header-actions">
      @if (facade.selectedCustomer(); as customer) {
        <div class="customer-badge">
          <span class="badge-label">{{ 'app.activeUser' | translate }}</span>
          <strong class="customer-name">{{ customer.name }}</strong>
          @if (customer.segment) {
            <p-tag [value]="customer.segment" severity="warn"></p-tag>
          }
        </div>
      }

      <div class="toggle-group">
        <p-button
          [label]="'app.toggleLang' | translate"
          [rounded]="true"
          [text]="true"
          size="small"
          [ariaLabel]="'app.switchLangLabel' | translate"
          (onClick)="langService.toggleLanguage()"
          styleClass="lang-toggle-btn"
        ></p-button>

        <p-button
          [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          [rounded]="true"
          [text]="true"
          [ariaLabel]="'app.toggleDark' | translate"
          (onClick)="themeService.toggleTheme()"
        ></p-button>
      </div>

      @if (authService.session(); as session) {
        <div class="user-profile">
          <p-avatar
            [label]="session.customer.name.charAt(0)"
            shape="circle"
            styleClass="profile-avatar"
          ></p-avatar>
          <div class="profile-info">
            <span class="user-email">{{ session.customer.email }}</span>
          </div>
          <p-button
            icon="pi pi-sign-out"
            [label]="'app.logout' | translate"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="authService.logout()"
          ></p-button>
        </div>
      }
    </div>
  </div>
</header>
