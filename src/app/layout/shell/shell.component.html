<div class="app-layout">
  <app-header></app-header>
  <app-navigation></app-navigation>

  <main class="main-content">
    @if (facade.isLoading()) {
      <div class="loading-state">
        <p-progressSpinner strokeWidth="4" ariaLabel="Loading application data"></p-progressSpinner>
        <p class="loading-text">Loading banking records...</p>
      </div>
    } @else if (facade.error()) {
      <div class="error-state">
        <p-message severity="error" [text]="facade.error()!"></p-message>
        <p-button label="Retry Loading" icon="pi pi-refresh" (onClick)="retry()"></p-button>
      </div>
    } @else {
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    }
  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; 2026 Apex Banking Corporation. Enterprise Portal. Confidential & Secure.</p>
    </div>
  </footer>
</div>
