<div class="customer-list-wrapper">
  <div class="list-header">
    <h2>{{ 'customerList.title' | translate }}</h2>
    <span class="customer-count-badge">{{ customers.length }}</span>
  </div>

  @if (customers.length === 0) {
    <div class="empty-list-notice">
      <i class="pi pi-users empty-icon" aria-hidden="true"></i>
      <p>{{ 'customerList.noCustomers' | translate }}</p>
    </div>
  } @else {
    <div class="customers-grid" role="listbox" [attr.aria-label]="'customerList.title' | translate">
      @for (cust of customers; track cust.CIF) {
        <div
          class="customer-card-item"
          [class.selected]="cust.CIF === selectedCustomerId"
          role="option"
          [attr.aria-selected]="cust.CIF === selectedCustomerId"
          tabindex="0"
          (click)="selectCustomer(cust.CIF)"
          (keydown)="onKeyDown($event, cust.CIF)"
        >
          <div class="item-avatar">
            <p-avatar
              [label]="cust.name.charAt(0)"
              shape="circle"
              size="normal"
              styleClass="avatar-circle"
            ></p-avatar>
          </div>

          <div class="item-details">
            <div class="name-row">
              <strong class="customer-name">{{ cust.name }}</strong>
              @if (cust.segment) {
                <p-tag [value]="cust.segment" [severity]="getSegmentSeverity(cust.segment)"></p-tag>
              }
            </div>
            <span class="customer-email">{{ cust.email }}</span>
          </div>

          @if (cust.CIF === selectedCustomerId) {
            <div class="selected-indicator">
              <i class="pi pi-check-circle" aria-hidden="true"></i>
            </div>
          }
        </div>
      }
    </div>
  }
</div>
