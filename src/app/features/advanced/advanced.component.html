<div class="advanced-page">
  <div class="page-header">
    <div class="header-text">
      <h1>{{ 'adv.title' | translate }}</h1>
      <p>{{ 'adv.subtitle' | translate }}</p>
    </div>

    <div class="header-actions">
      <p-button
        [label]="'mini.download' | translate"
        icon="pi pi-download"
        severity="success"
        [disabled]="!facade.selectedAccount() || facade.selectedAccountTransactions().length === 0"
        (onClick)="onExportCsv()"
      ></p-button>
    </div>
  </div>

  @if (facade.isLoading()) {
    <div class="skeleton-layout">
      <p-skeleton width="100%" height="220px" borderRadius="12px" styleClass="mb-3"></p-skeleton>
      <p-skeleton width="100%" height="300px" borderRadius="12px"></p-skeleton>
    </div>
  } @else if (facade.error()) {
    <div class="error-wrapper">
      <p-message severity="error" [text]="facade.error()!"></p-message>
      <p-button [label]="'shell.retry' | translate" icon="pi pi-refresh" (onClick)="facade.loadInitialData()"></p-button>
    </div>
  } @else {
    <div class="advanced-grid">
      <!-- Mini Statement Panel -->
      <div class="grid-col">
        <app-mini-statement
          [transactions]="facade.selectedAccountTransactions()"
          [selectedAccount]="facade.selectedAccount()"
          [limit]="5"
        ></app-mini-statement>
      </div>

      <!-- Monthly Insights Panel -->
      <div class="grid-col">
        <app-monthly-insights
          [transactions]="facade.selectedAccountTransactions()"
          [selectedAccount]="facade.selectedAccount()"
        ></app-monthly-insights>
      </div>
    </div>
  }
</div>
