<div class="transactions-page">
  <!-- Top Context Header & Account Switcher -->
  <div class="page-top-header">
    <div class="account-selector-box">
      <label for="accSelect" class="selector-label"><i class="pi pi-credit-card"></i> Selected Account</label>
      @if (facade.selectedAccount(); as selAcc) {
        <div class="account-picker-row">
          <p-select
            id="accSelect"
            [options]="accountOptions()"
            [ngModel]="selAcc.id"
            optionLabel="label"
            optionValue="value"
            (onChange)="onAccountSwitch($event.value)"
            styleClass="account-select-dropdown"
          ></p-select>

          <div class="account-quick-summary">
            <span class="balance-tag">
              Balance: <strong>{{ selAcc.balance | currency:selAcc.currency:'symbol':'1.2-2' }}</strong>
            </span>
            <p-tag [value]="selAcc.status" severity="success"></p-tag>
          </div>
        </div>
      } @else {
        <div class="no-account-alert">
          <p-message severity="info" text="No account currently selected. Select a customer and account from the Dashboard."></p-message>
        </div>
      }
    </div>

    <div class="create-tx-action">
      <p-button
        label="New Transaction"
        icon="pi pi-plus"
        severity="primary"
        [disabled]="!facade.selectedAccount()"
        (onClick)="openCreateModal()"
      ></p-button>
    </div>
  </div>

  @if (facade.isLoading()) {
    <div class="skeleton-wrapper">
      <p-skeleton width="100%" height="120px" borderRadius="12px" styleClass="mb-3"></p-skeleton>
      <p-skeleton width="100%" height="350px" borderRadius="12px"></p-skeleton>
    </div>
  } @else if (facade.error()) {
    <div class="error-wrapper">
      <p-message severity="error" [text]="facade.error()!"></p-message>
      <p-button label="Retry" icon="pi pi-refresh" (onClick)="facade.loadInitialData()"></p-button>
    </div>
  } @else {
    <!-- Filters Panel -->
    <app-transaction-filters
      [categories]="facade.categories()"
      [types]="facade.types()"
      (filterChange)="onFilterChange($event)"
      (filterReset)="onFilterReset()"
    ></app-transaction-filters>

    <!-- Transaction List Table -->
    <app-transaction-list
      [transactions]="filteredTransactions()"
      [isFiltered]="isFiltered()"
    ></app-transaction-list>
  }

  <!-- Create Transaction Dialog -->
  <app-create-transaction
    [categories]="facade.categories()"
    [types]="facade.types()"
    [selectedAccount]="facade.selectedAccount()"
    [(visible)]="isCreateModalOpen"
    (transactionCreated)="onTransactionCreated($event)"
  ></app-create-transaction>
</div>
