<div class="filters-container">
  <div class="filters-header">
    <div class="header-title">
      <i class="pi pi-filter"></i>
      <h4>{{ 'filters.title' | translate }}</h4>
    </div>
    <p-button
      [label]="'filters.clear' | translate"
      icon="pi pi-filter-slash"
      severity="secondary"
      [text]="true"
      size="small"
      (onClick)="resetFilters()"
    ></p-button>
  </div>

  <div class="filters-grid">
    <!-- Date Range Picker -->
    <div class="filter-field">
      <label for="startDate">{{ 'filters.startDate' | translate }}</label>
      <p-datePicker
        id="startDate"
        [(ngModel)]="startDate"
        [placeholder]="'filters.startDate' | translate"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        (onSelect)="onFilterUpdate()"
        (onClear)="onFilterUpdate()"
      ></p-datePicker>
    </div>

    <div class="filter-field">
      <label for="endDate">{{ 'filters.endDate' | translate }}</label>
      <p-datePicker
        id="endDate"
        [(ngModel)]="endDate"
        [placeholder]="'filters.endDate' | translate"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        (onSelect)="onFilterUpdate()"
        (onClear)="onFilterUpdate()"
      ></p-datePicker>
    </div>

    <!-- Type Selector -->
    <div class="filter-field">
      <label for="typeFilter">{{ 'filters.type' | translate }}</label>
      <p-select
        id="typeFilter"
        [options]="typeOptions()"
        [(ngModel)]="selectedType"
        optionLabel="label"
        optionValue="value"
        (onChange)="onFilterUpdate()"
      ></p-select>
    </div>

    <!-- Category Selector -->
    <div class="filter-field">
      <label for="categoryFilter">{{ 'filters.category' | translate }}</label>
      <p-select
        id="categoryFilter"
        [options]="categoryOptions()"
        [(ngModel)]="selectedCategory"
        optionLabel="label"
        optionValue="value"
        (onChange)="onFilterUpdate()"
      ></p-select>
    </div>

    <!-- Search Input -->
    <div class="filter-field search-field">
      <label for="merchantSearch">{{ 'filters.searchPlaceholder' | translate }}</label>
      <div class="search-input-wrapper">
        <i class="pi pi-search search-icon"></i>
        <input
          id="merchantSearch"
          type="text"
          pInputText
          [(ngModel)]="searchQuery"
          [placeholder]="'filters.searchPlaceholder' | translate"
          (input)="onFilterUpdate()"
        />
      </div>
    </div>
  </div>
</div>
